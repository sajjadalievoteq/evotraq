org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options="-Xmx2048M"
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
org.gradle.warning.mode=all
org.gradle.daemon=true
kotlin.incremental=true
# Fix for bcprov-jdk18on Java 21 compatibility
android.jetifier.ignorelist=bcprov-jdk18on
# Required for AGP 9+ R8 optimized resource shrinking (release minify)
android.nonFinalResIds=true
# Keep false until Flutter 3.47+ and plugins (file_picker, mobile_scanner) migrate off KGP
android.builtInKotlin=false
android.newDsl=false
