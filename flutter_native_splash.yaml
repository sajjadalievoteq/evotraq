# Minimal required platform launch screen. The Flutter branded splash takes
# over on the first successful frame.
#
# web: false — web splash is maintained separately in web/index.html
# (see tool/generate_native_splash.py). Do not regenerate web from this file.
#
# Regenerate Android/iOS only:
#   dart run flutter_native_splash:create --path=flutter_native_splash.yaml
flutter_native_splash:
  color: "#F2F2EF"
  color_dark: "#1C1C1B"
  image: assets/branding/splash-icon-black-padded.png
  image_dark: assets/branding/splash-icon-white-padded.png
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  android: true
  ios: true
  web: false

  android_12:
    color: "#F2F2EF"
    color_dark: "#1C1C1B"
    image: assets/branding/splash-icon-black-padded.png
    image_dark: assets/branding/splash-icon-white-padded.png
    icon_background_color: "#F2F2EF"
    icon_background_color_dark: "#1C1C1B"
