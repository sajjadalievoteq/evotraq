# Native launch — solid brand color + logo only. Bootstrap runs behind this
# screen until [dismissNativeSplash] is called from [AppStartupGate].
#
# Source logo: assets/images/logo/logo.svg
# Regenerate platform splashes: python tool/generate_native_splash.py
flutter_native_splash:
  color: "#F2F2EF"
  color_dark: "#1C1C1B"
  image: assets/images/logo/logo.svg
  image_dark: assets/images/logo/logo.svg
  android_gravity: center
  ios_content_mode: scaleAspectFit
  web_image_mode: center
  fullscreen: true
  android: true
  ios: true
  web: true

  android_12:
    color: "#F2F2EF"
    color_dark: "#1C1C1B"
    image: assets/images/logo/logo.svg
    image_dark: assets/images/logo/logo.svg
    icon_background_color: "#F2F2EF"
    icon_background_color_dark: "#1C1C1B"
