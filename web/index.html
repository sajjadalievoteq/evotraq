<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="traq.io">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png?v=3">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=3">
  <link rel="shortcut icon" type="image/png" href="icons/Icon-192.png?v=3">

  <title>traq</title>
  <link rel="manifest" href="manifest.json?v=3">

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer=""></script>
  <script src="flutter_bootstrap.js" async=""></script>

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #F2F2EF;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #1c1c1b;
      }
    }
  </style>
  <style id="splash-screen-style">
    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #F2F2EF;
    }

    /* traq-native-splash-responsive */
    #splash {
      position: fixed;
      inset: 0;
      display: block;
      background-color: #F2F2EF;
    }

    #splash img.center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(136px, 34vmin, 300px);
      height: auto;
      max-width: 50vw;
      max-height: 50vh;
      object-fit: contain;
    }

    @media (orientation: portrait), (max-width: 1024px) {
      #splash img.center {
        width: clamp(128px, 38vmin, 260px);
      }
    }

    @media (prefers-color-scheme: dark) {
      body,
      #splash {
        background-color: #1C1C1B;
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <picture id="splash">
    <source
      srcset="splash/img/splash-lockup-dark.png"
      media="(prefers-color-scheme: dark)">
    <img
      class="center"
      aria-hidden="true"
      src="splash/img/splash-lockup-light.png"
      alt="">
  </picture>
</body>
</html>
